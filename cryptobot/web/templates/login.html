<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>crypto-bot · sign in</title>
  <style>
    :root { --bg:#0d1117; --panel:#161b22; --border:#2a3340; --text:#e6edf3;
      --muted:#8b98a5; --accent:#58a6ff; --down:#f85149; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); min-height:100vh;
      display:flex; align-items:center; justify-content:center;
      font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .card { background:var(--panel); border:1px solid var(--border);
      border-radius:12px; padding:28px; width:320px; }
    h1 { font-size:18px; margin:0 0 4px; }
    .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
    label { display:block; font-size:12px; color:var(--muted); font-weight:600;
      margin-bottom:5px; }
    input { width:100%; background:var(--bg); color:var(--text);
      border:1px solid var(--border); border-radius:8px; padding:10px;
      font-size:14px; margin-bottom:14px; }
    input:focus { outline:none; border-color:var(--accent); }
    button { width:100%; background:var(--accent); color:#05192e; border:none;
      border-radius:8px; padding:11px; font-weight:700; font-size:14px; cursor:pointer; }
    .error { color:var(--down); font-size:13px; margin-bottom:12px; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>crypto-bot</h1>
    <div class="sub">Sign in to the dashboard</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus value="admin">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
